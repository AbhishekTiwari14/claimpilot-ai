[project]
name = "claimpilot-ai"
version = "0.1.0"
description = "ClaimPilot AI backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pillow>=12.3,<14",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]
agents = [
    "groq>=1,<2",
    "langchain>=1,<2",
    "langchain-groq>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.16,<1",
    "chromadb>=1,<2",
    "langchain-text-splitters>=1,<2",
    "pypdf>=7.1,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
